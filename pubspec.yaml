name: pin
description: "A lightweight, local-first Kanban desktop application built for Linux with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  http: ^1.2.2
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.10.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - firebase-applet-config.json
