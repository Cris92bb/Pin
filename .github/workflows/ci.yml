name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup placeholder configuration
        run: |
          if [ ! -f firebase-applet-config.json ]; then
            echo '{}' > firebase-applet-config.json
          fi

      - name: Static analysis
        run: flutter analyze

      - name: FSD architecture audit
        run: dart run tool/verify_fsd.dart --strict

      - name: Tests
        run: flutter test
